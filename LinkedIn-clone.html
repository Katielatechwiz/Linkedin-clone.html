<!DOCTYPE html>
<html>
  <head>
    <title>
  LinkedIn.Clone   
</title>
<link rel="stylesheet" href="LinkedIn-clone.css"/>
    </head>

     <body>
<nav>
  <!-- Logo -->
   <a href="#">LinkedIn</a>

  <!-- Search-Bar -->
   <input type="text" placeholder="Search" /> 

  <!-- Nav Links -->
  <ul>
    <li><a href="#">Home</a></li>
    <li><a href="#">My Network</a></li>
    <li><a href="#">Jobs</a></li>
    <li><a href="#">Messaging</a></li>
    <li><a href="#">Notifications</a></li>
  </ul>


  <a href="#" class="me-link">Me</a>
</nav>

<main>
  <!-- Left Sidebar -->
   <aside class="left sidebar">
    <div class="profile-card">

      <!-- Banner -->
     <div class="banner"></div>

      <!-- Profile Image -->
       <img src="Images/Profile picture.jpg" alt="Profile Image">
  
       <!-- User Name -->
      <h2>Oluwanifemi Adekunle</h2>

      <!-- Job Title -->
      <p>Student</p>

      <!-- Company Name -->
       <p>MOU</p>
    </div>
      </aside>

   <!-- Feed -->
    <section id="feed">
      <div class="post-composer">
        <img src="images/profile picture.jpg" alt="Profile Image" class="profile-image">
        <input type="text" placeholder="Start a post" />
      </div>
         <!-- Post Header -->   
<div class="post">
<div class="post-header">
    <img src="Images/Profile picture.jpg" alt="Profile Photo"/>
    <div>
      <h3>Oluwanifemi Adekunle</h3>
      <p>Student at MOU</p> 
      <p>2h ago</p>
    </div>
    <!-- Post content -->
     <p class="post-content"> This is my first LinkedIn post!🎉</p>
    
     <!-- Post actions -->
     <div class="post-actions">
      <button>👍 like</button>
      <button>💭 Comment</button>
      <button>🔁 Repost</button>
      <button>📩 Send</button>
     </div>
</div>
</div>
      
    </section>

    <!-- Right Sidebar -->
     <aside class="right sidebar">
      <div class="suggestions-card">
        <h3>People you may know</h3>
        <div class="suggestions">
          <img src="Images/mivauniversity_logo (1).jpg" alt="Profile Photo"/>
          <div>
            <h4>Miva University</h4>
            <p>Education</p>
          </div>
           <button>Connect</button>
           </div>
          
     </aside>

    </main>
     </body>

</html>
